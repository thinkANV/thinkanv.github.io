<h1>ThinkANV</h1>
<p>ThinkANV is an operating system, like Linux or FreeBSD, written from scratch for x86_64 computers that boot with UEFI. It has its own bootloader and kernel, runs Linux programs through a Linux-compatible system call interface, and collects no telemetry.</p>
